services:
 db:
   container_name: calltracking_db
   image: postgres:15
   ports:
      - "5433:5432"
   env_file:
    - .env
   volumes:
    - db_data:/var/lib/postgresql/data

   restart: unless-stopped
   healthcheck:
     test: [ "CMD-SHELL", "pg_isready -U postgres" ]
     interval: 10s
     timeout: 5s
     retries: 5
     
volumes:
  db_data:
